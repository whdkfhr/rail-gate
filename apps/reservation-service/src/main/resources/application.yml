spring:
  application:
    name: reservation-service

  datasource:
    hikari:
      # CLAUDE.md 규칙 9. MySQL 기본값 50초는 경합 시 커넥션 풀을 고갈시킨다 —
      # 승자가 잠깐 늦어지면 나머지 요청이 전부 50초씩 커넥션을 점유하고
      # 무관한 좌석 조회까지 실패한다.
      #
      # 커넥션 생성 시 한 번만 적용한다. 홀드 경로에서 매번 SET 을 보내면
      # 요청당 왕복이 하나 늘어난다. MySqlTestSupport 픽스처와 같은 방식이다.
      connection-init-sql: "SET SESSION innodb_lock_wait_timeout = 3"
      # MySQL max_connections 기본값 151 을 넘기지 않도록 제한한다.
      maximum-pool-size: 64

  flyway:
    # 마이그레이션은 reservation-infra 의 classpath:db/migration 에 있다.
    # 앱은 위치를 재정의하지 않고 그 모듈의 것을 그대로 쓴다 — 두 벌이 되면 어긋난다.
    enabled: true

server:
  # 8080/8081 은 개발 머신에서 다른 서비스와 충돌하기 쉬워 18080 대역을 쓴다.
  port: 18081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.railgate: DEBUG

# ---------------------------------------------------------------------------
# 만료 배치 스케줄러 (TASK-002H-E)
#
# ★ 기본 비활성이다. 만료 회수는 좌석을 되돌리고 quota 를 줄이는 쓰기 작업이므로,
#   기존 데이터의 backfill(TASK-002G-G §4)과 drift 점검(V-7a·b·c)을 마치기 전에
#   켜면 안 된다. enabled=false 이면 스케줄 등록도 스레드 풀도 생기지 않는다.
#
# 켤 때는 pageSize·maxPages·fixed-delay 가 모두 양수여야 하고, 아니면 기동 단계에서 실패한다.
# ---------------------------------------------------------------------------
railgate:
  expiry:
    sweep:
      enabled: false
      # 직전 실행이 끝난 뒤 다음 실행까지의 간격. fixedRate 가 아니라 fixedDelay 다.
      fixed-delay: 30s
      # 후보 SELECT 한 번의 LIMIT. 벌크 UPDATE 크기의 상한이 아니다.
      page-size: 100
      # 한 tick 이 읽을 최대 페이지 수. 검사 후보 수의 상한은 page-size × max-pages.
      max-pages: 4
